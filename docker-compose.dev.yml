services:
  portfolio:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: my-portfolio-dev
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - portfolio_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true
    # Volume de node_modules começa vazio na 1ª vez — instalar antes do dev; exec para sinais corretos.
    command: sh -c "npm install --no-audit --no-fund && exec npm run dev"
    restart: unless-stopped

volumes:
  portfolio_node_modules:
